[package]
name = "statsai-daemon"
description = "Loopback daemon API for statsai."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
doctest = false

[dependencies]
statsai-adapters.workspace = true
statsai-core.workspace = true
statsai-store.workspace = true
anyhow.workspace = true
chrono.workspace = true
ascii = "1"
chunked_transfer = "1"
httpdate = "1"
log = "0.4"
notify = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
fsevent-sys = "4.1"
libc.workspace = true

[features]
watch = ["dep:notify"]

[dev-dependencies]
tempfile.workspace = true
