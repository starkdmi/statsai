[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
packages = ["statsai"]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Per-arch mac builds; release workflow also publishes a lipo universal artifact.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# GitHub no longer accepts macos-14, dist's default runner for
# aarch64-apple-darwin ("The configuration 'macos-14-arm64-us-default' is not
# supported"), so that build runs on macos-15, as dev-build.yml does.
github-custom-runners = { aarch64-apple-darwin = "macos-15" }
tap = "starkdmi/homebrew-tap"
formula = "statsai"
publish-jobs = ["homebrew"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
allow-dirty = ["ci"]
# Releases happen only from version tags; PRs must not run release CI at all.
pr-run-mode = "skip"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
