name: Claude review status

# Turns the Claude review routine's summary comment into a `claude/review`
# commit status, so the verdict can be required for merge. The routine's own
# status writes are refused, so this workflow is the only writer of that
# context.
#
# - A summary comment from `hexnyl` that starts with `<!-- claude-review ... -->`
#   sets success (Verdict: pass) or failure (Verdict: fail, or no verdict,
#   which is how the round-cap comment looks) on the SHA named in the marker.
# - Every new push to a PR resets the status to pending, so a stale pass
#   cannot carry over to commits the routine has not seen.

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: claude-review-status-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pending:
    name: Reset on push
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'claude/review',
              description: 'awaiting the next Claude review round',
            });

  verdict:
    name: Set from summary
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'hexnyl' &&
      startsWith(github.event.comment.body, '<!-- claude-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body;
            const marker = body.match(/<!--\s*claude-review\b([^>]*)-->/);
            const attrs = Object.fromEntries(
              [...(marker ? marker[1] : '').matchAll(/(\w+)=([^\s]+)/g)].map(m => [m[1], m[2]])
            );

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });

            // Only trust a SHA that is actually the PR head; otherwise the
            // comment is about an older commit and a new push already reset
            // the status to pending.
            const sha = attrs.sha && attrs.sha.length >= 7 && pr.head.sha.startsWith(attrs.sha.replace(/[^0-9a-f]/gi, ''))
              ? pr.head.sha
              : null;
            if (!sha) {
              core.notice(`Summary is for ${attrs.sha || 'an unknown SHA'}, PR head is ${pr.head.sha}; leaving status as is.`);
              return;
            }

            const verdict = (body.match(/\*\*Verdict:?\*\*:?\s*`?(pass|fail)`?/i) || [])[1];
            const state = verdict && verdict.toLowerCase() === 'pass' ? 'success' : 'failure';
            const round = attrs.round ? `round ${attrs.round}: ` : '';
            const firstLine = (body.split('\n').find(l => /\*\*Verdict:?\*\*/.test(l)) || '')
              .replace(/\*\*Verdict:?\*\*:?\s*/i, '').replace(/[`*]/g, '').trim();
            const description = (round + (firstLine || (verdict ? verdict : 'no verdict in summary; needs a human'))).slice(0, 140);

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'claude/review',
              description,
              target_url: context.payload.comment.html_url,
            });
            core.info(`claude/review=${state} on ${sha}: ${description}`);
