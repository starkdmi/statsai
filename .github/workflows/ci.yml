name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: statsai-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/rust-ci.sh fmt
      - run: ./scripts/rust-ci.sh clippy
      - run: ./scripts/rust-ci.sh test

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config dbus gnome-keyring
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/rust-ci.sh fmt
      - run: ./scripts/rust-ci.sh clippy
      - run: ./scripts/rust-ci.sh test

  pricing-file:
    name: Pricing file
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Runs the check below on edited copies of pricing.json, with --files
      # and with a git ref, so a check that could no longer fail fails here.
      - name: Test the pricing file check
        run: scripts/test-check-pricing-file.sh
      # A pull request run checks out the merge commit GitHub built for the
      # event. Its first parent is the base tip it was merged onto, so this
      # checks only the pull request's own change, even on a re-run after
      # main moved.
      - name: Check the pull request's change
        if: github.event_name == 'pull_request'
        run: scripts/check-pricing-file.sh HEAD^1
      # Two pull requests can each pass against the base they saw and still
      # merge into a main whose file changed without a higher version. Checking
      # each push to main against the tip it replaced fails main loudly then.
      - name: Check the change pushed to main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: scripts/check-pricing-file.sh "$BEFORE"
        env:
          BEFORE: ${{ github.event.before }}

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
